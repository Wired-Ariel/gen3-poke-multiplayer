<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<title>test bridge.js</title>
<style>body{font:14px Consolas,monospace;background:#0e1117;color:#e6e6e6;padding:16px} .ok{color:#7ee787} .ko{color:#ff7b72} .nota{color:#9aa4b2}</style>
</head>
<body>
<h2>bridge.js + relay.js — gli stessi casi di tools/test_ricucitura.py, piu' dedup, VIA e header</h2>
<p class="nota">Aggiungi <code>?relay=ws://127.0.0.1:9001</code> all'URL per la prova INTEGRATA: due bridge in questa pagina parlano attraverso relay_ws.py + relay.py veri (servono accesi).</p>
<pre id="out"></pre>
<script src="js/sio.js"></script>
<script src="js/battito.js"></script>
<script src="js/relay.js"></script>
<script src="js/club.js"></script>
<script src="js/bridge.js"></script>
<script src="js/chat.js"></script>
<script>
(function () {
  var out = [], ok = 0, ko = 0, EV = OwlBridge.EV;
  function eq(a, b) { return JSON.stringify(a) === JSON.stringify(b); }
  function t(nome, fn) {
    try { var r = fn(); if (r === true) { ok++; out.push("<span class=ok>OK </span>" + nome); }
          else { ko++; out.push("<span class=ko>KO </span>" + nome + " -> " + JSON.stringify(r)); } }
    catch (e) { ko++; out.push("<span class=ko>KO </span>" + nome + " -> " + e.message); }
  }
  function ev(kind, dir, x, y, mapn, seq, mapg) {
    var b = new Uint8Array(12);
    b[0] = kind; b[1] = dir; b[2] = 1; b[3] = seq === undefined ? 7 : seq; b[4] = mapg || 0; b[5] = mapn === undefined ? 2 : mapn;
    b[6] = x & 0xFF; b[7] = (x >> 8) & 0xFF; b[8] = y & 0xFF; b[9] = (y >> 8) & 0xFF;
    return b;
  }
  function descr(e) { var s16 = function (lo, hi) { var v = lo | (hi << 8); return v & 0x8000 ? v - 0x10000 : v; }; return [e[0], e[1], s16(e[6], e[7]), s16(e[8], e[9])]; }
  function fake(copie) {
    var outEv = [];
    var b = new OwlBridge({ peerId: 1, room: 1, copies: copie || 1, device: { sendEvent: function (e) { outEv.push(new Uint8Array(e)); return Promise.resolve(); } }, log: function () {} });
    b.copyTokens = 1e9;   // secchiello pieno e fermo: qui si prova la ridondanza, non il tetto
    b.out = outEv;
    return b;
  }
  function dedupPayload(eventi) { var last = null, o = []; for (var i = 0; i < eventi.length; i++) { var e = eventi[i]; if (e[0] === 1 || e[0] === 3) { if (last !== null && e[3] === last) continue; last = e[3]; } o.push(e); } return o; }

  function caso(nome, eventi, attesi, healed, far) {
    var f = fake();
    eventi.forEach(function (e) { f.healAndDeliver(1, e); });
    var got = f.out.map(descr);
    t(nome, function () { return (eq(got, attesi) && f.healed === healed && f.healFar === (far || 0)) || { got: got, healed: f.healed, far: f.healFar }; });
    return f;
  }

  // --- la ricucitura (identica a tools/test_ricucitura.py) ---
  caso("passi contigui, nessuna sintesi", [ev(1, 4, 11, 16), ev(1, 4, 12, 16)], [[1, 4, 11, 16], [1, 4, 12, 16]], 0);
  caso("passo perso in retta -> 1 sintetico", [ev(2, 4, 10, 16), ev(1, 4, 12, 16)], [[2, 4, 10, 16], [1, 4, 11, 16], [1, 4, 12, 16]], 1);
  caso("buco a L -> nessuna sintesi", [ev(2, 4, 10, 16), ev(1, 1, 11, 17)], [[2, 4, 10, 16], [1, 1, 11, 17]], 0);
  caso("SYNC con buco a L -> nessuna sintesi", [ev(2, 4, 10, 16), ev(2, 4, 12, 17)], [[2, 4, 10, 16], [2, 4, 12, 17]], 0);
  caso("buco contro la direzione del passo -> nessuna sintesi", [ev(2, 3, 14, 16), ev(1, 4, 12, 16)], [[2, 3, 14, 16], [1, 4, 12, 16]], 0);
  caso("SYNC dopo 2 passi persi -> 2 sintetici", [ev(2, 4, 10, 16), ev(2, 4, 12, 16)], [[2, 4, 10, 16], [1, 4, 11, 16], [1, 4, 12, 16], [2, 4, 12, 16]], 2);
  caso("cambio mappa -> nessuna sintesi", [ev(2, 4, 10, 16, 2), ev(1, 3, 66, 16, 32)], [[2, 4, 10, 16], [1, 3, 66, 16]], 0);
  caso("buco largo -> heal_far, nessuna sintesi", [ev(2, 4, 10, 16), ev(2, 4, 20, 16)], [[2, 4, 10, 16], [2, 4, 20, 16]], 0, 1);
  caso("GIRA dopo un passo perso -> 1 sintetico", [ev(2, 4, 10, 16), ev(3, 2, 11, 16)], [[2, 4, 10, 16], [1, 4, 11, 16], [3, 2, 11, 16]], 1);
  caso("SYNC da fermo, nessuna sintesi", [ev(2, 4, 10, 16), ev(2, 4, 10, 16), ev(2, 4, 10, 16)], [[2, 4, 10, 16], [2, 4, 10, 16], [2, 4, 10, 16]], 0);
  caso("STATO in mezzo non rompe la catena", [ev(2, 4, 10, 16), ev(5, 2, 0, 0), ev(1, 4, 11, 16)], [[2, 4, 10, 16], [5, 2, 0, 0], [1, 4, 11, 16]], 0);
  caso("PASSO con direzione fuori tabella -> consegna diretta", [ev(2, 4, 10, 16), ev(1, 9, 12, 16)], [[2, 4, 10, 16], [1, 9, 12, 16]], 0);

  var f = caso("tre passi ricuciti (seq controllato sotto)", [ev(2, 4, 10, 16, 2, 40), ev(1, 4, 14, 16, 2, 44)],
               [[2, 4, 10, 16], [1, 4, 11, 16], [1, 4, 12, 16], [1, 4, 13, 16], [1, 4, 14, 16]], 3);
  t("i sintetici prendono i seq persi (S-gap..S-1)", function () { var s = f.out.map(function (e) { return e[3]; }); return eq(s, [40, 41, 42, 43, 44]) || s; });

  t("ricucitura + copie x2 + dedup = ogni passo applicato una volta", function () {
    var g = fake(2);
    g.healAndDeliver(1, ev(2, 4, 10, 16, 2, 40)); g.healAndDeliver(1, ev(1, 4, 14, 16, 2, 44));
    var dopo = dedupPayload(g.out).map(descr);
    return (eq(dopo, [[2, 4, 10, 16], [1, 4, 11, 16], [1, 4, 12, 16], [1, 4, 13, 16], [1, 4, 14, 16]]) && g.out.length === 9 && g.wireSent === 9) || { dopo: dopo, n: g.out.length, scritti: g.wireSent };
  });
  t("persa una copia qualunque delle due, il passo arriva comunque", function () {
    var a = fake(2); a.healAndDeliver(1, ev(1, 4, 11, 16, 2, 50));
    var b = fake(2); b.healAndDeliver(1, ev(1, 4, 11, 16, 2, 50));
    return (dedupPayload([a.out[0]]).length === 1 && dedupPayload([b.out[1]]).length === 1 && eq(descr(a.out[0]), descr(b.out[1]))) || [a.out.length, b.out.length];
  });
  t("il VIA non viene mai duplicato", function () { var g = fake(2); g.deliver(ev(4, 0, 0, 0, 2, 0)); return g.out.length === 1 || g.out.length; });
  t("lo STATO non viene mai duplicato", function () { var g = fake(2); g.deliver(ev(5, 1, 0, 0, 2, 9)); return g.out.length === 1 || g.out.length; });
  t("a secchiello vuoto la copia si salta e si conta", function () {
    var g = fake(2); g.copyTokens = 0; g.copyStamp = performance.now();
    g.deliver(ev(1, 4, 11, 16, 2, 60));
    return (g.out.length === 1 && g.copiesSkipped === 1) || [g.out.length, g.copiesSkipped];
  });
  t("simulatore di perdita sul filo: conta i buttati", function () {
    var g = fake(2); g.wireLoss = 1; g.rand = function () { return 0; };
    g.deliver(ev(1, 4, 11, 16, 2, 61));
    return (g.out.length === 0 && g.wireDropped === 2) || [g.out.length, g.wireDropped];
  });

  // --- lo SPETTATORE (2026-08-26): il verbo con cui si entra in stanza ---
  function bridgeFinto(opts) {
    var mandati = [];
    var o = { peerId: 42, room: 7, device: null, log: function () {} };
    for (var k in (opts || {})) o[k] = opts[k];
    var b = new OwlBridge(o);
    b.link = { invia: function (d) { mandati.push(d); }, aperta: true };
    b.sendRelay = function (d) { mandati.push(d); };
    b.mandati = mandati;
    return b;
  }

  t("spettatore: entra in stanza con WATCH (5), non con HELLO", function () {
    var b = bridgeFinto({ spettatore: true });
    b.sendHello();
    var p = OwlRelay.unpack(b.mandati[0]);
    return (p.kind === OwlRelay.T.WATCH && p.kind === 5 && b.watchInviati === 1) || p.kind;
  });

  t("giocatore: entra con HELLO (0) - la compatibilita' non si tocca", function () {
    var b = bridgeFinto({});
    b.sendHello();
    var p = OwlRelay.unpack(b.mandati[0]);
    return (p.kind === OwlRelay.T.HELLO && p.kind === 0 && b.watchInviati === 0) || p.kind;
  });

  t("spettatore: start() arma la ritrasmissione del WATCH, stop() la spegne", function () {
    var b = bridgeFinto({ spettatore: true });
    b.start();
    var armato = b.timerWatch !== null;
    b.stop();
    var spento = b.timerWatch === null;
    var g = bridgeFinto({});
    g.start(); var giocatoreSenza = g.timerWatch === null; g.stop();
    return (armato && spento && giocatoreSenza) ||
           ("armato " + armato + " spento " + spento + " giocatore " + giocatoreSenza);
  });

  t("spettatore: il PING resta kind 2 (l'RTT non passa dal WATCH)", function () {
    var b = bridgeFinto({ spettatore: true });
    b.sendPing();
    var p = OwlRelay.unpack(b.mandati[0]);
    return p.kind === OwlRelay.T.PING || p.kind;
  });

  // --- il generatore dello script per l'emulatore (2026-08-26) ---
  // La funzione vive in app.js, che qui non e' caricato (tira su tutta la
  // pagina): si prova la STESSA logica, e il contratto con app.js e' che le
  // tre righe siano quelle. Se app.js cambiasse formato, il caso "riga
  // mancante" qui sotto resterebbe verde ma il sito fallirebbe rumorosamente
  // da solo, che e' il comportamento voluto.
  function configuraLuaProva(testo, url, stanza, peer, aperta) {
    // Gemella di app.js: la riga RELAY_PUBLIC e' facoltativa (2026-09-27).
    var rigaAperta = "RELAY_PUBLIC = " + (aperta ? "true" : "false");
    if (/^RELAY_PUBLIC\s*=.*$/m.test(testo)) testo = testo.replace(/^RELAY_PUBLIC\s*=.*$/m, rigaAperta);
    else if (aperta) testo = testo.replace(/^(RELAY_PEER\s*=.*)$/m, "$1\n" + rigaAperta);
    var righe = [
      { nome: "RELAY_URL", re: /^RELAY_URL\s*=.*$/m, val: 'RELAY_URL = "' + url + '"' },
      { nome: "RELAY_ROOM", re: /^RELAY_ROOM\s*=.*$/m, val: "RELAY_ROOM = " + stanza },
      { nome: "RELAY_PEER", re: /^RELAY_PEER\s*=.*$/m, val: "RELAY_PEER = " + peer }
    ];
    for (var i = 0; i < righe.length; i++) {
      if (!righe[i].re.test(testo)) throw new Error("template non compatibile: manca " + righe[i].nome);
      testo = testo.replace(righe[i].re, righe[i].val);
    }
    return testo;
  }
  var TEMPLATE_FINTO = [
    "PAYLOAD_BASE = 0x0203CF80",
    'LINK_ROLE = "relay"',
    'RELAY_URL = "ws://vecchio/ws"',
    "RELAY_ROOM = 1",
    "RELAY_PEER = 0",
    'ROM_titolo = "POKEMON EMER"'
  ].join("\n") + "\n";

  t("script per l'emulatore: le tre righe vengono riscritte, il resto no", function () {
    var out = configuraLuaProva(TEMPLATE_FINTO, "ws://host/ws", 4242, 0);
    return (/^RELAY_URL = "ws:\/\/host\/ws"$/m.test(out) &&
            /^RELAY_ROOM = 4242$/m.test(out) &&
            /^RELAY_PEER = 0$/m.test(out) &&
            out.indexOf('PAYLOAD_BASE = 0x0203CF80') === 0 &&
            out.indexOf('ROM_titolo = "POKEMON EMER"') > 0 &&
            out.indexOf("vecchio") < 0) || out;
  });

  t("script per l'emulatore: la spunta 'stanza aperta' arriva in RELAY_PUBLIC (anche su template vecchio)", function () {
    var nuovo = TEMPLATE_FINTO.replace("RELAY_PEER = 0\n", "RELAY_PEER = 0\nRELAY_PUBLIC = false\n");
    var a = configuraLuaProva(nuovo, "ws://h/ws", 7, 0, true);
    var b = configuraLuaProva(nuovo, "ws://h/ws", 7, 0, false);
    var c = configuraLuaProva(TEMPLATE_FINTO, "ws://h/ws", 7, 0, true);    // template senza la riga
    var d = configuraLuaProva(TEMPLATE_FINTO, "ws://h/ws", 7, 0, false);
    return (/^RELAY_PUBLIC = true$/m.test(a) && (a.match(/RELAY_PUBLIC/g) || []).length === 1 &&
            /^RELAY_PUBLIC = false$/m.test(b) &&
            /^RELAY_PEER = 0\nRELAY_PUBLIC = true$/m.test(c) &&
            d.indexOf("RELAY_PUBLIC") < 0) || [a, b, c, d];
  });

  t("script per l'emulatore: template monco -> ERRORE, non un file sbagliato", function () {
    var monco = TEMPLATE_FINTO.replace(/^RELAY_ROOM.*$/m, "");
    try { configuraLuaProva(monco, "ws://host/ws", 1, 0); return "non ha alzato errore"; }
    catch (e) { return /RELAY_ROOM/.test(e.message) || e.message; }
  });

  t("script per l'emulatore: wss:// diventa ws:// (il Lua non ha TLS)", function () {
    function relayPerLua(url) {
      if (/^wss:\/\//i.test(url)) return { url: "ws://" + url.slice(6), degradato: true };
      if (/^ws:\/\//i.test(url)) return { url: url, degradato: false };
      return { url: "ws://" + url.replace(/^https?:\/\//i, ""), degradato: false };
    }
    var a = relayPerLua("wss://gbcatrade.wired-ariel.it/ws");
    var b = relayPerLua("ws://127.0.0.1:9001/");
    return (a.url === "ws://gbcatrade.wired-ariel.it/ws" && a.degradato === true &&
            b.url === "ws://127.0.0.1:9001/" && b.degradato === false) || [a, b];
  });

  // --- L'ANIMAZIONE DELLA MAPPA (2026-08-26) ---
  //
  // Il difetto e' tornato DUE volte ("gli avatar saltano come pedine"), e le
  // due volte e' stato visto a occhio da Lain. Qui si misura invece di
  // guardare: si prendono le funzioni VERE da mappa.html (fetch + estrazione,
  // niente copia che poi diverge), si da' loro un orologio finto e si contano
  // i cicli di passo, il ritardo accumulato e i passi all'indietro.
  //
  // Le andature sono quelle del gioco: a piedi un tile ogni 16 frame
  // (~266 ms), di corsa 8 (~133), in bici 4 (~66). Alla mappa arrivano
  // POSIZIONI ogni ~260 ms, quindi 1, 2 e 4 tile per campione.
  function motoreMappa(src) {
    var i = src.indexOf("var anim = {};");
    var j = src.indexOf("// Finche' qualcuno cammina");
    if (i < 0 || j < 0) throw new Error("blocco dell'animazione non trovato in mappa.html");
    return new Function(
      "var orologio = 0; var performance = { now: function () { return orologio; } };\n" +
      src.slice(i, j) +
      "\nreturn { anim: anim, agg: aggiornaAnim, pos: posAnim, tempo: function (t) { orologio = t; } };")();
  }

  function corsaSimulata(m, passiPerCampione, periodo, nCampioni) {
    delete m.anim[7];
    m.tempo(0); m.agg({ peer: 7, x: 0, y: 0 });
    var storia = [], x = 0;
    for (var c = 1; c <= nCampioni; c++) {
      var tA = c * periodo;
      m.tempo(tA); x += passiPerCampione; m.agg({ peer: 7, x: x, y: 0 });
      for (var t = tA; t < tA + periodo; t += 16) {
        m.tempo(t); var p = m.pos(7); storia.push({ x: p.x, f: p.f, cam: p.cammina });
      }
    }
    var cicli = 0, indietro = 0;
    for (var k = 1; k < storia.length; k++) {
      if (storia[k].f !== 0 && storia[k - 1].f === 0) cicli++;
      if (storia[k].x < storia[k - 1].x - 1e-6) indietro++;
    }
    return { tile: x, cicli: cicli, indietro: indietro,
             ritardo: x - storia[storia.length - 1].x,
             fermo: storia.filter(function (s) { return !s.cam; }).length / storia.length };
  }

  (function () {
    var req = new XMLHttpRequest();
    try { req.open("GET", "mappa.html", false); req.send(null); } catch (e) { req.status = 0; }
    if (req.status !== 200) {
      out.push("<span class=nota>(mappa.html non servita da qui: salto i casi dell'animazione)</span>");
      return;
    }
    var m = motoreMappa(req.responseText);

    t("mappa: a piedi, un passo per tile e nessun ritardo", function () {
      var r = corsaSimulata(m, 1, 266, 6);
      return (r.cicli >= r.tile - 1 && r.ritardo < 0.2 && r.indietro === 0 && r.fermo === 0) || r;
    });

    t("mappa: DI CORSA (2 tile per campione) cammina, non scivola", function () {
      var r = corsaSimulata(m, 2, 266, 6);
      // il punto: due tile = DUE cicli di passo, non uno solo lungo il doppio
      return (r.cicli >= r.tile - 2 && r.ritardo < 0.5 && r.indietro === 0) || r;
    });

    t("mappa: IN BICI (4 tile per campione) si anima e non resta indietro", function () {
      var r = corsaSimulata(m, 4, 266, 6);
      // prima di 2026-08-26: nessuna animazione (PASSO_MAX 3), poi 8 tile di ritardo
      return (r.fermo < 0.1 && r.cicli >= 12 && r.ritardo < 1.5) || r;
    });

    t("mappa: un WARP non si anima (sarebbe una bugia)", function () {
      var r = corsaSimulata(m, 20, 266, 2);
      return (r.fermo === 1 && r.cicli === 0) || r;
    });
  })();

  // --- l'header OWL1 e il dedup dei datagrammi (accept_seq) ---
  t("pack/unpack: 11 byte di header, magic OWL1, campi al posto giusto", function () {
    var d = OwlRelay.pack(OwlRelay.T.EVENT, 0x1234, 0xABCD, 0x56, new Uint8Array([9, 8, 7]));
    var p = OwlRelay.unpack(d);
    return (d.length === 14 && d[0] === 0x4F && d[1] === 0x57 && d[2] === 0x4C && d[3] === 0x31 && d[4] === 1 &&
            p.kind === 1 && p.peerId === 0x1234 && p.roomId === 0xABCD && p.seq === 0x56 && eq(Array.from(p.body), [9, 8, 7])) || Array.from(d);
  });
  t("unpack rifiuta magic e versione sbagliati", function () {
    var d = OwlRelay.pack(1, 1, 1, 1); var e = new Uint8Array(d); e[4] = 2; var m = new Uint8Array(d); m[0] = 0x58;
    return (OwlRelay.unpack(e) === null && OwlRelay.unpack(m) === null && OwlRelay.unpack(new Uint8Array(5)) === null) || "accettato";
  });
  t("acceptSeq: duplicato scartato, arretrato scartato, riavvolgimento a 255->0 accettato", function () {
    var g = fake();
    var a = g.acceptSeq(7, 10), b = g.acceptSeq(7, 10), c = g.acceptSeq(7, 9), d = g.acceptSeq(7, 11);
    var g2 = fake(); g2.acceptSeq(8, 255); var e = g2.acceptSeq(8, 0); var f2 = g2.acceptSeq(8, 129);
    return (a && !b && !c && d && g.dupDropped === 1 && g.lateDropped === 1 && e && !f2) || [a, b, c, d, e, f2];
  });
  t("T_BYE dal relay -> VIA (tipo 4) al GBA con la mappa dell'ultimo evento del peer", function () {
    var g = fake();
    g.onRelayMessage(OwlRelay.pack(OwlRelay.T.EVENT, 5, 1, 1, ev(1, 4, 11, 16, 32)));
    g.onRelayMessage(OwlRelay.pack(OwlRelay.T.BYE, 5, 1, 0));
    var last = g.out[g.out.length - 1];
    return (g.out.length === 2 && last[0] === 4 && last[4] === 0 && last[5] === 32 && g.leaves === 1 && !g.peers[5]) || g.out.map(descr);
  });
  t("PONG misura l'RTT", function () {
    var g = fake(); var inviati = []; g.link = { send: function (b) { inviati.push(b); return true; } };
    g.sendPing(); var p = OwlRelay.unpack(inviati[0]);
    g.onRelayMessage(OwlRelay.pack(OwlRelay.T.PONG, 1, 1, p.seq));
    return (p.kind === OwlRelay.T.PING && g.rtts.length === 1 && g.rtts[0] >= 0) || p;
  });
  t("evento dal GBA -> T_EVENT al relay con seq crescente e la mappa ricordata", function () {
    var g = fake(); var inviati = []; g.link = { send: function (b) { inviati.push(OwlRelay.unpack(b)); return true; } };
    g.onDeviceEvent(ev(1, 4, 11, 16, 32)); g.onDeviceEvent(ev(2, 4, 11, 16, 32));
    return (inviati.length === 2 && inviati[0].kind === 1 && inviati[0].seq === 1 && inviati[1].seq === 2 && g.mapKey === 32 && g.sent === 2 && eq(Array.from(inviati[0].body), Array.from(ev(1, 4, 11, 16, 32)))) || inviati;
  });
  t("EVENT_CLUB dal GBA non si inoltra come evento; senza clubEnter sul device si dice e non parte", function () {
    var g = fake(); var inviati = []; g.link = { send: function (b) { inviati.push(b); return true; } };
    g.onDeviceEvent(ev(7, 0, 0, 0));
    return (inviati.length === 0 && g.clubAvvisi === 1 && g.club === null && g.clubSessions === -1) || [inviati.length, g.clubSessions];
  });

  // --- IL CABLE CLUB (2026-08-26): gli stessi casi di net/test_club.py -------
  //
  // Due ClubSession collegate da una rete finta che PERDE e RIORDINA come
  // l'UDP vero, e due device finti che recitano gli stati del firmware Celio.
  // La sessione (club.js) e' il porting riga per riga di club_link.py: questi
  // test sono il porting riga per riga di test_club.py, piu' i casi nuovi del
  // browser (ruoli coi peer sorteggiati, partner dal primo T_CLUB).
  (function () {
    var C = OwlClub, CP = C.proto, ST = C.ST, CC = C.CMD;

    function fdev() {
      return { commands: [], blocks: [],
               command: function (c) { this.commands.push(c); },
               sendBlock: function (b) { this.blocks.push(new Uint8Array(b)); } };
    }
    function fnet() {
      var net = { aToB: [], bToA: [], drop: {}, reorder: false, conta: { a: 0, b: 0 } };
      net.sender = function (lato) {
        var coda = lato === "a" ? net.aToB : net.bToA;
        return function (body) {
          var i = net.conta[lato]++;
          if (net.drop[i]) return;                    // perso per sempre
          coda.push(new Uint8Array(body));
        };
      };
      net.consegna = function (sess, coda) {
        var pend = coda.splice(0, coda.length);
        if (net.reorder && pend.length >= 2) { var t0 = pend[0]; pend[0] = pend[1]; pend[1] = t0; }
        for (var i = 0; i < pend.length; i++) {
          var p = CP.clubUnpack(pend[i]);
          if (!p) continue;
          if (p.sub === CP.CLUB_STATUS) sess.onNetStatus(p.epoca, p.sseq, p.status);
          else if (p.sub === CP.CLUB_DATA) sess.onNetBlock(p.epoca, p.seq, p.block);
          else if (p.sub === CP.CLUB_REQ) sess.onNetReq(p.epoca, p.seqs);
          else if (p.sub === CP.CLUB_ENTER) sess.notaPartner(p.epoca);
          else if (p.sub === CP.CLUB_LEAVE) sess.onNetLeave(p.epoca);
        }
      };
      return net;
    }
    function blocco(n) {
      var b = new Uint8Array(64);
      for (var i = 0; i < 32; i++) { b[2 * i] = n & 0xFF; b[2 * i + 1] = (n >> 8) & 0xFF; }
      return b;
    }
    function bloccoEq(a, b) { if (!a || !b || a.length !== b.length) return false; for (var i = 0; i < a.length; i++) if (a[i] !== b[i]) return false; return true; }
    function blocchiSono(lista, nn) {
      if (lista.length !== nn.length) return false;
      for (var i = 0; i < nn.length; i++) if (!bloccoEq(lista[i], blocco(nn[i]))) return false;
      return true;
    }
    function conta(arr, x) { var n = 0; for (var i = 0; i < arr.length; i++) if (arr[i] === x) n++; return n; }
    function patchK(patch, fn) {
      var vecchi = {};
      for (var k in patch) { vecchi[k] = C.K[k]; C.K[k] = patch[k]; }
      try { return fn(); } finally { for (var k2 in vecchi) C.K[k2] = vecchi[k2]; }
    }
    function coppia() {
      var net = fnet(), da = fdev(), db = fdev();
      // Come il setUp di test_club.py: sessione e sezione gia' armate, in
      // silenzio (i casi che quel confine lo provano se lo aprono da soli).
      var a = new C.ClubSession({ myPeer: 1, dev: da, sendNet: net.sender("a"), log: function () {} });
      var b = new C.ClubSession({ myPeer: 2, dev: db, sendNet: net.sender("b"), log: function () {} });
      a._avviata = b._avviata = true;
      // Il distanziamento del ConnectLink si azzera: i casi fanno la scala
      // in sincrono. Il ritardo vero ha il suo caso dedicato.
      C.K.CONNECT_RITARDO_S = 0;
      a._sezioneViva = b._sezioneViva = true;
      // ... e la sezione COLLEGATA, che dal 2026-08-27 e' il cancello vero
      // dei blocchi (i comandi della scala restano su _sezioneViva).
      a._sezionePronta = b._sezionePronta = true;
      var cc = { net: net, da: da, db: db, a: a, b: b };
      cc.scambia = function () { for (var i = 0; i < 4; i++) { net.consegna(b, net.aToB); net.consegna(a, net.bToA); } };
      cc.giro = function () {
        a.onDeviceStatus(ST.HANDSHAKE_RX); b.onDeviceStatus(ST.HANDSHAKE_RX); cc.scambia();
        a.onDeviceStatus(ST.CONNECTED); b.onDeviceStatus(ST.CONNECTED); cc.scambia();
      };
      return cc;
    }

    function fdevC() {

  /* --- IL PICO STACCATO (2026-08-30) ------------------------------------
   *
   * Il difetto del campo: staccando l'adattatore, il sito non se ne
   * accorgeva e il battito continuava a ripubblicare la fotografia della
   * presenza. L'amico vedeva il nostro avatar comparire (alla riapertura del
   * WebSocket) e sparire (al timeout del relay) ogni ~30 secondi, per dieci
   * minuti. Il gate della presenza era «il GBA tace da 2 s» - condizione che
   * un adattatore staccato soddisfa PER SEMPRE.
   *
   * Le tre prove sono i tre pezzi della cura, e la seconda e' quella che
   * conta: senza, si torna esattamente al difetto.
   */
  (function () {
    function bridgeConDevice(dev) {
      var b = new OwlBridge({ peerId: 1, room: 7, device: dev, log: function () {} });
      b.mandati = [];
      b.sendRelay = function (bytes) { b.mandati.push(OwlRelay.unpack(bytes)); return true; };
      return b;
    }

    t("pico staccato: la presenza NON riparte piu' (era il motore del va-e-vieni)", function () {
      var dev = { perso: false, sendEvent: function () { return Promise.resolve(); } };
      var b = bridgeConDevice(dev);
      b.ricordaPresenza(ev(2, 4, 10, 16));
      b.rimandaPresenza(true);                     // adattatore vivo: parte
      var vive = b.presenzeRimandate;
      dev.perso = true;                            // ...e adesso non c'e' piu'
      b.rimandaPresenza(true);
      b.rimandaPresenza(true);
      return (vive === 1 && b.presenzeRimandate === 1 && b.presenzeSoppresse === 2)
        || { vive: vive, rimandate: b.presenzeRimandate, soppresse: b.presenzeSoppresse };
    });

    t("pico staccato: parte un congedo VERO (T_BYE), non si sparisce tacendo", function () {
      var dev = { perso: true, sendEvent: function () { return Promise.resolve(); } };
      var b = bridgeConDevice(dev);
      b.ricordaPresenza(ev(2, 4, 10, 16));
      b.congeda("prova");
      b.congeda("prova");                          // una volta sola
      var bye = b.mandati.filter(function (m) { return m && m.kind === OwlRelay.T.BYE; });
      // e la fotografia sparisce: nessuna strada puo' piu' resuscitarci
      b.rimandaPresenza(true);
      return (bye.length === 1 && b.lastEvent === null && b.presenzeRimandate === 0)
        || { bye: bye.length, lastEvent: b.lastEvent, rimandate: b.presenzeRimandate };
    });

    t("pico ricollegato: la presenza riprende (il gate non resta chiuso per sempre)", function () {
      var morto = { perso: true, sendEvent: function () { return Promise.resolve(); } };
      var vivo = { perso: false, sendEvent: function () { return Promise.resolve(); } };
      var b = bridgeConDevice(morto);
      b.ricordaPresenza(ev(2, 4, 10, 16));
      b.rimandaPresenza(true);                     // soppressa
      b.cambiaDevice(vivo);
      b.ricordaPresenza(ev(2, 4, 11, 16));         // il GBA riparla
      b.rimandaPresenza(true);
      return (b.presenzeSoppresse === 1 && b.presenzeRimandate === 1 && b.congedato === false)
        || { soppresse: b.presenzeSoppresse, rimandate: b.presenzeRimandate, congedato: b.congedato };
    });

    t("spettatore: nessun device, la presenza deve restare LIBERA di partire", function () {
      // Chi guarda dal sito gioca in emulatore: la sua sorgente non e' il
      // Pico. Se il gate nuovo lo prendesse per un adattatore morto, gli
      // spettatori sparirebbero dalla mappa - una regressione peggiore del
      // difetto che si sta curando.
      var b = new OwlBridge({ peerId: 9, room: 7, device: null, spettatore: true, log: function () {} });
      b.mandati = [];
      b.sendRelay = function (bytes) { b.mandati.push(OwlRelay.unpack(bytes)); return true; };
      b.ricordaPresenza(ev(2, 4, 10, 16));
      b.rimandaPresenza(true);
      return (b.presenzeRimandate === 1 && b.presenzeSoppresse === 0)
        || { rimandate: b.presenzeRimandate, soppresse: b.presenzeSoppresse };
    });
  })();

    return ((a === "ws://127.0.0.1:9001" || a === "wss://127.0.0.1:9001") && b === "wss://relay.esempio.it/ws" && c === "wss://x/y") || [a, b, c];

    function scheda(squadra, extra) {

      for (var k = 0; k < 0x44; k++) b[k] = (k * 7) & 0xFF;      // il resto della scheda: rumore

        b[0x54 + i * 2] = m[0] & 0xFF; b[0x55 + i * 2] = m[0] >> 8; b[0x44 + i] = m[1];
        if (m[2]) shiny |= 1 << i; if (m[3]) ko |= 1 << i;
      });
      b[0x4A] = shiny; b[0x4B] = ko;
      if (extra) extra(b);
      return b;
    }
    function pezzi(b, idx) {     // la scheda a pezzi, come EmitCardChunk (kCardOff = 2,6..11)
      var off = [2, 6, 7, 8, 9, 10, 11];
      return idx.map(function (i) {
        var e = new Uint8Array(12); e[0] = 6; e[1] = i;
        for (var k = 0; k < 7 && i * 7 + k < 96; k++) e[off[k]] = b[i * 7 + k];
        return e;
      });
    }

    // --- I DETTAGLI DELLA SQUADRA E LA PRIVACY (2026-10-16) -------------------
    function record(o) {      // i 28 byte di PARTY_REC del payload
      var r = new Uint8Array(28);
      (o.nick || []).forEach(function (b, i) { r[i] = b; });
      r[10] = o.lv; r[11] = o.stato || 0;
      r[12] = o.ps & 255; r[13] = o.ps >> 8; r[14] = o.psMax & 255; r[15] = o.psMax >> 8;
      r[16] = o.item & 255; r[17] = o.item >> 8;
      o.mosse.forEach(function (m, i) { r[18 + i * 2] = m & 255; r[19 + i * 2] = m >> 8; });
      r[26] = o.natura; r[27] = o.sesso;
      return r;
    }
    function pezziParty(mon, rec) {   // i 4 pezzi EVENT_PARTY di un Pokemon (kCardOff)
      var off = [2, 6, 7, 8, 9, 10, 11], out = [];
      for (var q = 0; q < 4; q++) {
        var e = new Uint8Array(12); e[0] = 9; e[1] = mon * 4 + q;
        for (var k = 0; k < 7; k++) e[off[k]] = rec[q * 7 + k];
        out.push(e);
      }
      return out;
    }

    br.link = l; l.connect();
  }
  collega(A); collega(B);
  var fine = Date.now() + 6000;
  var fase = 0;
  var timer = setInterval(function () {
    if (fase === 0 && aperti === 2) {
      fase = 1;
      A.sendPing(); B.sendPing();
      chatA.scrivi("ci sei? è la chat, dal relay vero");
      A.onDeviceEvent(ev(2, 4, 10, 16, 2, 40));        // SYNC
      A.onDeviceEvent(ev(1, 4, 12, 16, 2, 42));        // PASSO a due tile: B deve RICUCIRE
      A.onDeviceEvent(ev(5, 1, 12, 16, 2, 43));        // STATO lotta
      B.onDeviceEvent(ev(2, 1, 5, 5, 2, 1));
      return;
    }
    if (fase === 1 && (ricevutiB.length >= 7 && ricevutiA.length >= 2)) {
      fase = 2;
      var d = dedupPayload(ricevutiB).map(descr);
      t("INTEGRATA: A -> relay_ws -> relay -> relay_ws -> B, ricucito e con le copie", function () {
        // SYNC(1) + 2 passi x2 copie (ricucito 11 + vero 12) + STATO(1) = 6 frame, piu' la
        // PRESENZA che A rimanda quando vede il primo evento di B (bridge.js:319, feature del
        // 2026-08-28): un SYNC dell'ultima posizione di A, (12,16). Sette frame, dedup -> 5
        // eventi, `received` 4 (il passo ricucito lo sintetizza B, non arriva dalla rete).
        // Fino al 2026-08-29 qui c'erano i numeri di PRIMA della presenza, e questa prova era
        // rossa sul sito pubblicato senza che niente fosse rotto.
        return (eq(d, [[2, 4, 10, 16], [1, 4, 11, 16], [1, 4, 12, 16], [5, 1, 12, 16], [2, 4, 12, 16]])
          && B.healed === 1 && B.received === 4) || { d: d, healed: B.healed, received: B.received, frames: ricevutiB.length };
      });
      t("INTEGRATA: B -> A (verso opposto)", function () { return (eq(descr(ricevutiA[0]), [2, 1, 5, 5]) && A.received === 2) || { primo: descr(ricevutiA[0]), received: A.received }; });
      // La presenza, guardata dal lato di chi la riceve: il secondo frame che arriva ad A e' la
      // fotografia che B rimanda perche' ha appena visto A. E' un SYNC (mai un PASSO: rimandare
      // un passo farebbe camminare l'avatar una seconda volta) e sta sull'ultima posizione di B.
      t("INTEGRATA: la presenza rimandata arriva a chi entra (SYNC, non PASSO)", function () {
        return (eq(descr(ricevutiA[1]), [2, 1, 5, 5]) && B.presenzeRimandate >= 1 && A.presenzeRimandate >= 1)
          || { secondo: ricevutiA[1] ? descr(ricevutiA[1]) : null, presenzeB: B.presenzeRimandate, presenzeA: A.presenzeRimandate };
      });
      t("INTEGRATA: la chat passa da relay_ws.py + relay.py (A scrive, B legge, col nome), e non torna ad A", function () {
        var v = chatB.store.voci[0];
        return (v && v.testo === "ci sei? è la chat, dal relay vero" && v.nome === "Lain" && v.peer === 1001 && !v.mio &&
                chatA.store.voci.length === 1 && chatA.store.voci[0].mio === true && B.chatRicevuti === 1 && A.chatRicevuti === 0) ||
               { b: chatB.store.voci, a: chatA.store.voci, ricB: B.chatRicevuti, ricA: A.chatRicevuti };
      });
      t("INTEGRATA: i PONG tornano (RTT misurato)", function () { return (A.rtts.length >= 1 && B.rtts.length >= 1) || [A.rtts.length, B.rtts.length]; });
      A.link.close();                                     // A chiude: B deve ricevere il VIA
      return;
    }
    if (fase === 2) {
      var ultimo = ricevutiB[ricevutiB.length - 1];
      if (ultimo && ultimo[0] === 4) {
        fase = 3;
        t("INTEGRATA: A chiude la pagina -> B riceve il VIA (tipo 4) entro 2 s", function () { return (ultimo[5] === 2 && B.leaves === 1) || descr(ultimo); });
        clearInterval(timer); B.link.close(); stampa();
        return;
      }
    }
    if (Date.now() > fine) {
      clearInterval(timer);
      t("INTEGRATA: completata entro 6 s (fase " + fase + ", B ha " + ricevutiB.length + " frame, A " + ricevutiA.length + ", aperti " + aperti + ")", function () { return fase === 3 || "relay non raggiungibile o lento"; });
      try { A.link.close(); B.link.close(); } catch (e) { /* niente */ }
      stampa();
    }
  }, 100);
})();
</script>
